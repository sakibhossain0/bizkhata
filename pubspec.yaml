name: bizkhata
description: "BizKhata - stock, khata, POS and courier management"
publish_to: 'none'

version: 1.2.1+4

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  sqlite3: ^3.7.0
  path_provider: ^2.1.6
  path: ^1.9.1
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  shared_preferences: ^2.5.5
  http: ^1.6.0
  url_launcher: ^6.3.2
  file_picker: ^13.1.0
  printing: ^5.15.1
  pdf: ^3.13.1
  screenshot: ^3.0.0
  barcode_widget: ^2.0.4
  fl_chart: ^1.2.0
  intl: ^0.20.3
  crypto: ^3.0.7
  window_manager: ^0.5.2
  mobile_scanner: ^7.4.2
  screen_retriever: ^0.2.2
  share_plus: ^13.3.1
  google_sign_in: ^7.2.0
  ffi: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.1

flutter:
  uses-material-design: true

  fonts:
    # Bangla + Latin body text (OFL, Indian Type Foundry).
    - family: HindSiliguri
      fonts:
        - asset: assets/fonts/HindSiliguri-Light.ttf
          weight: 300
        - asset: assets/fonts/HindSiliguri-Regular.ttf
          weight: 400
        - asset: assets/fonts/HindSiliguri-Medium.ttf
          weight: 500
        - asset: assets/fonts/HindSiliguri-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/HindSiliguri-Bold.ttf
          weight: 700
    # Display face for headings and big numbers (OFL variable font).
    - family: Bricolage
      fonts:
        - asset: assets/fonts/BricolageGrotesque.ttf
