# Sized for an 8 GB RAM PC (the Flutter template's -Xmx8G crashes the JVM there).
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx1536m
org.gradle.workers.max=2
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# flutter_inappwebview_android 1.1.3 (the built-in browser) still names the old
# proguard-android.txt, which AGP 9 refuses by default. Drop this once the plugin
# switches to proguard-android-optimize.txt.
android.r8.proguardAndroidTxt.disallowed=false
